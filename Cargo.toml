[workspace]
resolver = "2"
exclude = ["examples/external-plugin"]
members = [
    "crates/term-core",
    "crates/plugin-sdk",
    "crates/plugin-api",
    "crates/port-app",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# Pino exacto: gpui es pre-1.0 y cambia entre versiones.
gpui = "=0.2.2"
alacritty_terminal = "0.26"
portable-pty = "0.9"
# `xattr 0.2.3` usa `libc::ENOATTR`, que se eliminó en libc 0.2.190. Fijado
# aquí para que un `cargo update` no rompa la build sin avisar.
libc = "=0.2.189"
# En el workspace de `port` el API y el core son SIEMPRE locales: son parte de
# este repo. Si los plugins trajeran su propia copia, main.rs implementaría el
# trait contra un crate y los plugins contra otro, y no coincidirían.
port-term-core = { path = "crates/term-core" }
port-plugin-api = { path = "crates/plugin-api" }
port-plugin-transparency = { git = "https://github.com/loonbac/port-plugins.git", tag = "v0.1.2" }
port-plugin-font = { git = "https://github.com/loonbac/port-plugins.git", tag = "v0.1.2" }
port-plugin-font-zoom = { git = "https://github.com/loonbac/port-plugins.git", tag = "v0.1.2" }
port-plugin-shortcuts = { git = "https://github.com/loonbac/port-plugins.git", tag = "v0.1.2" }
port-plugin-herdr = { git = "https://github.com/loonbac/port-plugins.git", tag = "v0.1.2" }
port-plugin-close-guard = { git = "https://github.com/loonbac/port-plugins.git", tag = "v0.1.2" }

# Los plugins llegan como dependencias git, pero deben usar el API y el core de
# ESTE repo: son el mismo código, no dos copias. Sin esto, `Plugin` se resuelve
# a dos crates distintos y el registro no compila.
[patch."https://github.com/loonbac/port.git"]
port-term-core = { path = "crates/term-core" }
port-plugin-api = { path = "crates/plugin-api" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

