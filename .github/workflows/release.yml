# ─────────────────────────────────────────────────────────────────────────────
# Release de PORT
#
# Mismo hardening que ci.yml:
#  - acciones fijadas a SHA completo (nunca etiqueta)
#  - solo acciones de GitHub, sin terceros
#  - permisos mínimos: solo el job final publica
#  - no corre en pull_request, así que jamás toca código no confiable
#
# La publicación usa el `gh` CLI, que ya viene en el runner, en lugar de una
# acción de terceros: cada dependencia externa es superficie de ataque.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: port
  RUST_TOOLCHAIN: stable

jobs:
  linux-binary:
    name: linux / binary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # El workspace trae parches a rutas locales (`../port-plugins/...`) para
      # desarrollar sin publicar. Ese repositorio hermano no existe en el runner,
      # así que se retiran antes de resolver dependencias.
      - name: Retirar parches locales
        run: ./scripts/disable-local-patch.sh

      - name: Instalar Nix
        run: |
          set -eu
          HOME_DIR="$HOME"
          export HOME_DIR
          export NIX_INSTALL_DIR="$HOME/.nix"

          # El config debe existir ANTES del instalador: en las imagenes
          # single-user de Fedora, Debian y Arch el grupo `nixbld` no existe, y
          # la instalacion aborta si intenta usarlo.
          mkdir -p "$HOME/.config/nix"
          printf '%s\n' \
            'experimental-features = nix-command flakes' \
            'build-users-group =' \
            'sandbox = true' \
            > "$HOME/.config/nix/nix.conf"

          curl -fsSL --proto '=https' --tlsv1.2 https://nixos.org/nix/install \
            | sh -s -- --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Cache de Nix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.nix-profile
            /nix/var/nix/gcroots
            /nix/store
          key: nix-release-${{ hashFiles('flake.nix', 'Cargo.lock') }}
          restore-keys: nix-release-

      - name: Build
        run: nix build .#port --print-build-logs

      - name: Test
        run: nix develop --command cargo test --workspace --locked

      - name: Preparar dist
        run: |
          set -eu
          mkdir -p dist
          cp result/bin/${{ env.BIN }} dist/
          # El tag manda: es lo que el usuario acaba de publicar. Si no hay tag todavia
            # (por ejemplo en una ejecucion manual), se recurre a Cargo.toml, que es la
            # fuente unica de la version del proyecto.
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
            if [ -z "$VERSION" ]; then
              VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
            fi
            echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Subir binario
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-binary
          path: dist/${{ env.BIN }}
          if-no-files-found: error

  # Binario portable: compilado en Docker contra un glibc antiguo para que
  # arranque en la mayor parte de distribuciones, con las librerias de GPU
  # empaquetadas al lado y RUNPATH relativo.
  portable:
    name: bundle portable
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Retirar parches locales
        run: ./scripts/disable-local-patch.sh

      # Docker viene preinstalado en los runners de Ubuntu, asi que el bundle
      # se compila igual para todos los usuarios con independencia de su
      # toolchain local.
      - name: Compilar bundle portable
        run: ./scripts/build-portable.sh

      - name: Paquetes nativos
        run: |
          set -eu
          ./scripts/package.sh deb
          ./scripts/package.sh rpm

      - name: Comprobar el bundle
        run: |
          set -eu
          BUNDLE="$(echo dist/port-*-linux-x86_64)"
          echo "Bundle: $BUNDLE"
          # El intérprete no debe apuntar al store: es lo que hace portable
          # al binario fuera de Nix.
          interp="$(readelf -l "$BUNDLE/bin/port" | sed -n 's/.*interpreter: \(.*\)\]/\1/p')"
          case "$interp" in
            /nix/store/*) echo "::error::el intérprete sigue en el store"; exit 1 ;;
          esac
          echo "Intérprete: $interp"

      - name: Subir artefactos
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-portable
          path: dist/
          if-no-files-found: error

  packages:
    name: packages / ${{ matrix.package }}
    runs-on: ubuntu-24.04
    needs: linux-binary
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # dpkg-deb y rpmbuild no están en los runners; el script genera el .deb
        # a mano con `ar` y el .spec para empaquetado externo.
        package: [deb, spec]

    steps:
      - name: Descargar binario
        uses: actions/download-artifact@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          name: release-binary
          path: result/bin

      - name: Empaquetar
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -eu
          # El .deb se construye sin dpkg-deb: es un `ar` con tres entradas.
          if [ "$PKG" = "deb" ]; then
            ./scripts/package.sh deb
          else
            ./scripts/package.sh rpm
          fi
          ls -la dist/ || true

      - name: Subir paquetes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.package }}
          path: dist/
          if-no-files-found: warn

  publish:
    name: publicar release
    runs-on: ubuntu-24.04
    needs: [linux-binary, portable, packages]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 20
    # Único job con permiso de escritura.
    permissions:
      contents: write

    steps:
      - name: Recolectar artefactos
        uses: actions/download-artifact@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          FILES="$(find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.spec' -o -name 'port' \) | tr '\n' ' ')"
          if [ -z "$FILES" ]; then
            echo "no hay artefactos que publicar" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" $FILES \
            --title "PORT ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "$(cat <<'NOTES'
            ## Instalar

            **Nix** (cualquier distro de Linux, macOS o Windows con Nix):
            ```bash
            nix profile install github:loonbac/port
            port
            ```

            **Paquete nativo**:
            - Debian/Ubuntu: `sudo apt install ./port.deb`
            - Fedora/RHEL: `sudo dnf install ./port.rpm`

            ## Configuración

            El primer arranque crea `~/.config/port/config.md`. Cada plugin
            tiene su propio bloque y el archivo se recarga al guardarlo.
            NOTES
            )"
