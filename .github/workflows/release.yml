# ─────────────────────────────────────────────────────────────────────────────
# Release de PORT
#
# Mismo hardening que ci.yml:
#  - acciones fijadas a SHA completo (nunca etiqueta)
#  - solo acciones de GitHub, sin terceros
#  - permisos mínimos: solo el job final publica
#  - no corre en pull_request, así que jamás toca código no confiable
#
# La publicación usa el `gh` CLI, que ya viene en el runner, en lugar de una
# acción de terceros: cada dependencia externa es superficie de ataque.
#
# La release entrega paquetes nativos (.deb y .rpm). El binario se compila en
# Docker contra Debian 12 (glibc 2.36) para que ambos paquetes arranquen en
# Ubuntu 22.04+ y Fedora 36+, y después se prueba la instalación real en esas
# distribuciones antes de publicar.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  # Publicar es una decisión local: el binario y los paquetes se compilan y se
  # prueban en la máquina de desarrollo (`scripts/ensayo-release.sh`) y la
  # release se publica desde ahí con `gh release create`. Este workflow queda
  # como respaldo manual para cuando esa máquina no esté disponible; el push de
  # cada rama lo siguen verificando `ci.yml` y `packages.yml`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: port
  RUST_TOOLCHAIN: stable

jobs:
  linux-binary:
    name: linux / binary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # El workspace trae parches a rutas locales (`../port-plugins/...`) para
      # desarrollar sin publicar. Ese repositorio hermano no existe en el runner,
      # así que se retiran antes de resolver dependencias.
      - name: Retirar parches locales
        run: ./scripts/disable-local-patch.sh

      - name: Instalar Nix
        run: |
          set -eu
          HOME_DIR="$HOME"
          export HOME_DIR
          export NIX_INSTALL_DIR="$HOME/.nix"

          # El config debe existir ANTES del instalador: en las imagenes
          # single-user de Fedora, Debian y Arch el grupo `nixbld` no existe, y
          # la instalacion aborta si intenta usarlo.
          mkdir -p "$HOME/.config/nix"
          printf '%s\n' \
            'experimental-features = nix-command flakes' \
            'build-users-group =' \
            'sandbox = true' \
            > "$HOME/.config/nix/nix.conf"

          curl -fsSL --proto '=https' --tlsv1.2 https://nixos.org/nix/install \
            | sh -s -- --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Cache de Nix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.nix-profile
            /nix/var/nix/gcroots
            /nix/store
          key: nix-release-${{ hashFiles('flake.nix', 'Cargo.lock') }}
          restore-keys: nix-release-

      - name: Build
        run: nix build .#port --print-build-logs

      - name: Test
        run: nix develop --command cargo test --workspace --locked

  # Paquetes nativos: el binario se compila en Docker contra un glibc antiguo
  # para que el .deb y el .rpm funcionen en Debian/Ubuntu/Fedora, y despues
  # scripts/test-install.sh los instala de verdad en cada distribucion. Esa
  # prueba es el porton de la release: un paquete que instala pero no arranca
  # no llega a publicarse.
  native-packages:
    name: paquetes nativos
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Retirar parches locales
        run: ./scripts/disable-local-patch.sh

      # Docker viene preinstalado en los runners de Ubuntu, asi que el binario
      # se compila igual con independencia del toolchain local.
      - name: Compilar binario de release
        run: ./scripts/build-portable.sh

      - name: Paquetes nativos
        run: |
          set -eu
          ./scripts/package.sh deb
          ./scripts/package.sh rpm
          # shellcheck source=scripts/version.sh
          source scripts/version.sh
          for f in "dist/port-$PORT_VERSION.deb" "dist/port-$PORT_VERSION.rpm"; do
            [ -f "$f" ] || { echo "::error::falta $f"; exit 1; }
          done

      - name: Probar instalación en el sistema
        run: |
          ./scripts/test-install.sh deb
          ./scripts/test-install.sh rpm

      - name: Subir artefactos
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  publish:
    name: publicar release
    runs-on: ubuntu-24.04
    needs: [linux-binary, native-packages]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 20
    # Único job con permiso de escritura.
    permissions:
      contents: write

    steps:
      # El paso de publicacion lee la version de Cargo.toml (fuente unica de
      # la version); sin este checkout no existiria y el job moriria ahi.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Recolectar artefactos
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # shellcheck source=scripts/version.sh
          source scripts/version.sh
          # Seleccion EXPLICITA de assets, nunca un find generico sobre todo
          # dist/. Solo salen los paquetes nativos: el bundle portable y el
          # tarball se retiraron, y el binario suelto ya no se publica.
          FILES=""
          for f in \
            "dist/port-$PORT_VERSION.deb" \
            "dist/port-$PORT_VERSION.rpm"; do
            if [ -f "$f" ]; then
              FILES="$FILES $f"
            else
              echo "::warning::no se encuentra $f (se publica sin el)"
            fi
          done
          FILES="${FILES# }"
          if [ -z "$FILES" ]; then
            echo "no hay artefactos que publicar" >&2
            exit 1
          fi
          echo "Publicando:$FILES"
          gh release create "${GITHUB_REF_NAME}" $FILES \
            --title "PORT ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "$(cat <<'NOTES'
          ## Instalar

          **Paquetes nativos (recomendado)**:
          - Debian / Ubuntu: `sudo apt install ./port-<version>.deb`
          - Fedora / RHEL: `sudo dnf install ./port-<version>.rpm`

          Instalan la terminal como cualquier otra: binario en `/usr/bin`,
          entrada `.desktop` e icono en las rutas del sistema. Se compilan
          contra glibc 2.36, asi que funcionan en Ubuntu 22.04+ y Fedora 36+.

          **Nix** (cualquier distro de Linux, macOS o Windows con Nix):
          ```bash
          nix profile install github:loonbac/port
          port
          ```

          ## Configuracion

          El primer arranque crea `~/.config/port/config.md`. Cada plugin
          tiene su propio bloque y el archivo se recarga al guardarlo.
          NOTES
          )"
