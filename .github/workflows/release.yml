# ─────────────────────────────────────────────────────────────────────────────
# Release de PORT
#
# Mismo hardening que ci.yml:
#  - acciones fijadas a SHA completo (nunca etiqueta)
#  - solo acciones de GitHub, sin terceros
#  - permisos mínimos: solo el job final publica
#  - no corre en pull_request, así que jamás toca código no confiable
#
# La publicación usa el `gh` CLI, que ya viene en el runner, en lugar de una
# acción de terceros: cada dependencia externa es superficie de ataque.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: port
  RUST_TOOLCHAIN: stable

jobs:
  linux-binary:
    name: linux / binary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # El workspace trae parches a rutas locales (`../port-plugins/...`) para
      # desarrollar sin publicar. Ese repositorio hermano no existe en el runner,
      # así que se retiran antes de resolver dependencias.
      - name: Retirar parches locales
        run: ./scripts/disable-local-patch.sh

      - name: Instalar Nix
        run: |
          set -eu
          HOME_DIR="$HOME"
          export HOME_DIR
          export NIX_INSTALL_DIR="$HOME/.nix"

          # El config debe existir ANTES del instalador: en las imagenes
          # single-user de Fedora, Debian y Arch el grupo `nixbld` no existe, y
          # la instalacion aborta si intenta usarlo.
          mkdir -p "$HOME/.config/nix"
          printf '%s\n' \
            'experimental-features = nix-command flakes' \
            'build-users-group =' \
            'sandbox = true' \
            > "$HOME/.config/nix/nix.conf"

          curl -fsSL --proto '=https' --tlsv1.2 https://nixos.org/nix/install \
            | sh -s -- --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Cache de Nix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.nix-profile
            /nix/var/nix/gcroots
            /nix/store
          key: nix-release-${{ hashFiles('flake.nix', 'Cargo.lock') }}
          restore-keys: nix-release-

      - name: Build
        run: nix build .#port --print-build-logs

      - name: Test
        run: nix develop --command cargo test --workspace --locked

      # `id: meta` hace falta: el job declara su salida como
      # `steps.meta.outputs.version`. Sin el id la salida quedaba vacia.
      - name: Preparar dist
        id: meta
        run: |
          set -eu
          mkdir -p dist
          cp result/bin/${{ env.BIN }} dist/
          # El tag manda: es lo que el usuario acaba de publicar. Si no hay tag todavia
          # (por ejemplo en una ejecucion manual), se recurre a Cargo.toml, que es la
          # fuente unica de la version del proyecto.
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          fi
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Subir binario
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-binary
          path: dist/${{ env.BIN }}
          if-no-files-found: error

  # Binario portable: compilado en Docker contra un glibc antiguo para que
  # arranque en la mayor parte de distribuciones, con las librerias de GPU
  # empaquetadas al lado y RUNPATH relativo.
  portable:
    name: bundle portable
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Retirar parches locales
        run: ./scripts/disable-local-patch.sh

      # Docker viene preinstalado en los runners de Ubuntu, asi que el bundle
      # se compila igual para todos los usuarios con independencia de su
      # toolchain local.
      - name: Compilar bundle portable
        run: ./scripts/build-portable.sh

      - name: Paquetes nativos
        run: |
          set -eu
          ./scripts/package.sh deb
          ./scripts/package.sh rpm
      # Esta comprobacion replica la verificacion local que precede a cualquier
      # cambio de release: `./scripts/build-portable.sh` + arranque del bundle +
      # presencia del .desktop y de los iconos. El paso de arranque importa:
      # el fallo que bloqueo todas las releases (bundle.sh con `$ROOT` sin
      # definir) ocurria JUSTO DESPUES de que el binario arrancara, al copiar
      # iconos, y aqui no se ejecutaba nada, asi que el job se veia roto sin
      # mas.
      - name: Comprobar el bundle
        run: |
          set -eu
          BUNDLE="$(echo dist/port-*-linux-x86_64)"
          echo "Bundle: $BUNDLE"
          if [ ! -x "$BUNDLE/bin/port" ]; then
            echo "::error::ejecutable bin/port no encontrado en $BUNDLE"
            exit 1
          fi
          # El intérprete no debe apuntar al store: es lo que hace portable
          # al binario fuera de Nix.
          interp="$(readelf -l "$BUNDLE/bin/port" | sed -n 's/.*interpreter: \(.*\)\]/\1/p')"
          case "$interp" in
            /nix/store/*) echo "::error::el intérprete sigue en el store"; exit 1 ;;
          esac
          echo "Intérprete: $interp"

          # El binario debe arrancar de verdad, no solo estar bien formado.
          "$BUNDLE/bin/port" --help | head -3

          # Y el bundle debe traer el .desktop y los iconos que bundle.sh
          # instala al final. Comprobarlos aqui hace visible al instante una
          # rotura de ese paso, en vez de publicar un bundle incompleto.
          for f in \
            share/applications/port.desktop \
            share/icons/hicolor/256x256/apps/port-terminal.png \
            share/pixmaps/port-terminal.png; do
            if [ ! -e "$BUNDLE/$f" ]; then
              echo "::error::falta $f dentro del bundle"
              exit 1
            fi
          done
          echo "Desktop e iconos presentes"

      # El README promete `port-*.tar.gz` como instalacion recomendada, y
      # hasta ahora NINGUN workflow creaba ese tar.gz: la release no podia
      # cumplir su propia documentacion. Se crea aqui, con la misma fuente de
      # version que bundle.sh (version.sh -> Cargo.toml), justo despues de la
      # verificacion y antes de subir el artefacto.
      - name: Empaquetar bundle en tar.gz
        run: |
          set -eu
          # shellcheck source=scripts/version.sh
          source scripts/version.sh
          TARBALL="port-$PORT_VERSION-linux-x86_64.tar.gz"
          # El -f se abre desde el cwd del proceso, no desde -C: primero se
          # crea en el cwd y despues se mueve a dist/ para no dejar el tar
          # dentro de si mismo.
          tar -czf "$TARBALL" -C dist "port-$PORT_VERSION-linux-x86_64"
          mv "$TARBALL" "dist/$TARBALL"
          ls -la "dist/$TARBALL"

      - name: Subir artefactos
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-portable
          path: dist/
          if-no-files-found: error

  publish:
    name: publicar release
    runs-on: ubuntu-24.04
    needs: [linux-binary, portable]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 20
    # Único job con permiso de escritura.
    permissions:
      contents: write

    steps:
      # El paso de publicacion lee la version de Cargo.toml (fuente unica de
      # la version); sin este checkout no existiria y el job moriria ahi.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Recolectar artefactos
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Seleccion EXPLICITA de assets, nunca un find generico sobre todo
          # dist/. Antes el find -name 'port' cazaba tambien
          # deb-root/usr/bin/port y el binario del bundle: dos ficheros con el
          # mismo nombre 'port' en la misma release, y `gh` rechaza assets
          # duplicados. Ademas faltaba el tar.gz que promete el README.
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          FILES=""
          for f in \
            "dist/port-$VERSION-linux-x86_64.tar.gz" \
            "dist/port-$VERSION.deb" \
            "dist/port.spec"; do
            if [ -f "$f" ]; then
              FILES="$FILES $f"
            else
              echo "::warning::no se encuentra $f (se publica sin el)"
            fi
          done
          FILES="${FILES# }"
          if [ -z "$FILES" ]; then
            echo "no hay artefactos que publicar" >&2
            exit 1
          fi
          echo "Publicando:$FILES"
          gh release create "${GITHUB_REF_NAME}" $FILES \
            --title "PORT ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "$(cat <<'NOTES'
          ## Instalar

          **Bundle portable (recomendado)**:
          ```bash
          tar xf port-*.tar.gz
          ./port-*/bin/port
          ```

          **Paquete nativo**:
          - Debian/Ubuntu: `sudo apt install ./port-<version>.deb`

          **Nix** (cualquier distro de Linux, macOS o Windows con Nix):
          ```bash
          nix profile install github:loonbac/port
          port
          ```

          ## Configuracion

          El primer arranque crea `~/.config/port/config.md`. Cada plugin
          tiene su propio bloque y el archivo se recarga al guardarlo.
          NOTES
          )"
