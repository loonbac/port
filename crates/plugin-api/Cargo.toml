[package]
name = "port-plugin-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PORT: Contratos y traits públicos para plugins"

[dependencies]
gpui = { workspace = true }
port-term-core = { path = "../term-core" }
port-plugin-sdk = { path = "../plugin-sdk" }
# El protocolo entre el core y los plugins externos es JSON sobre stdio.
# Solo se usa en ese borde: dentro del proceso no hay serializacion.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
