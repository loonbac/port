[package]
name = "port"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PORT: Plugin-Oriented Rust Terminal"

[[bin]]
name = "port"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
port-term-core = { path = "../term-core" }
port-plugin-api = { path = "../plugin-api" }
# herdr draws with GPUI, so it is compiled into PORT itself (see the root
# Cargo.toml for the git dependency and the port.git patch).
port-plugin-herdr = { workspace = true }
